<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>📊 卒論進捗ダッシュボード（文字数）</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📊 卒論進捗ダッシュボード</h1>
  <p class="subtitle">文字数ベースで進捗を可視化します</p>

  <!-- ダービーに戻る -->
  <p style="text-align:center; margin-bottom:30px;">
    ← <a href="index.html">ダービー画面に戻る</a>
  </p>

  <!-- ① 今日の文字数（棒グラフ） -->
  <section>
    <h2>① 本日の文字数（人別）</h2>
    <canvas id="barTodayChars"></canvas>
  </section>

  <!-- ② 累積文字数（折れ線） -->
  <section style="margin-top:50px;">
    <h2>② 累積文字数の推移（日別）</h2>
    <canvas id="lineCumulativeChars"></canvas>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
